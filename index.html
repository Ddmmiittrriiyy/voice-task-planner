<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>VoiceTasks</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1 data-i18n="appTitle">Голосовые задачи</h1>
  <div class="tabs">
    <button class="tab active" data-view="active" data-i18n="activeTab">Активные</button>
    <button class="tab" data-view="done" data-i18n="doneTab">Выполненные</button>
  </div>
  <div class="langRow">
    <button class="langBtn" data-lang="ru">RU</button>
    <button class="langBtn" data-lang="uk">UA</button>
    <button class="langBtn" data-lang="en">EN</button>
  </div>
</header>

<main id="list" class="list"></main>

<p id="empty" class="empty hidden" data-i18n="empty">Пока пусто. Скажите или напишите задачу ниже.</p>

<footer class="inputbar">
  <button id="micBtn" class="mic" title="Голосовой ввод" aria-label="Голосовой ввод" data-i18n-title="voiceInput" data-i18n-aria="voiceInput">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </button>
  <input id="textInput" type="text" placeholder="Например: завтра в 10 утра гараж" autocomplete="off">
  <button id="sendBtn" class="send" title="Добавить" aria-label="Добавить" data-i18n-title="add" data-i18n-aria="add">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
  </button>
</footer>

<div id="toast" class="toast hidden"></div>

<!-- Edit / move modal -->
<div id="modalOverlay" class="overlay hidden">
  <div class="modal">
    <h2 id="modalTitle" data-i18n="editTask">Редактировать задачу</h2>
    <label class="field">
      <span data-i18n="textLabel">Текст</span>
      <input id="editText" type="text">
    </label>
    <label class="field">
      <span data-i18n="dateLabel">Дата</span>
      <input id="editDate" type="date">
    </label>
    <label class="field">
      <span data-i18n="timeLabel">Время (необязательно)</span>
      <input id="editTime" type="time">
    </label>
    <div class="modalActions">
      <button id="modalCancel" class="btnGhost" data-i18n="cancel">Отмена</button>
      <button id="modalSave" class="btnPrimary" data-i18n="save">Сохранить</button>
    </div>
  </div>
</div>

<div id="confirmOverlay" class="overlay hidden">
  <div class="modal small">
    <h2 data-i18n="deleteQuestion">Удалить задачу?</h2>
    <p class="confirmText" data-i18n="deleteWarning">Действие нельзя отменить.</p>
    <div class="modalActions">
      <button id="confirmCancel" class="btnGhost" data-i18n="cancel">Отмена</button>
      <button id="confirmDelete" class="btnDanger" data-i18n="delete">Удалить</button>
    </div>
  </div>
</div>

<!-- header menu for export/import -->
<button id="menuBtn" class="menuBtn" aria-label="Меню" data-i18n-aria="menu">⋮</button>
<div id="menu" class="menu hidden">
  <button id="exportBtn" data-i18n="exportFile">Экспорт в файл</button>
  <button id="importBtn" data-i18n="importFile">Импорт из файла</button>
  <input id="importFile" type="file" accept="application/json" class="hidden">
</div>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
